<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book an Appointment — Radiant Health Alliance</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="book">

<header class="site-header" id="site-header"></header>

<section class="hero" style="padding-bottom:2vh;">
  <div class="container">
    <span class="eyebrow">Book an Appointment</span>
    <h1>Let's find you a <em>time</em></h1>
    <p class="lead">Choose a department and doctor, pick a time that works, and you're booked.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="card form-card" style="padding:2rem;">
      <div id="loginNotice" class="alert alert-error"></div>

      <div class="form-group">
        <label for="deptSelect">Department</label>
        <select id="deptSelect"><option value="">Choose a department…</option></select>
      </div>

      <div class="form-group">
        <label for="doctorSelect">Doctor</label>
        <select id="doctorSelect"><option value="">Choose a doctor…</option></select>
      </div>

      <div class="form-group">
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput">
      </div>

      <div id="slotsWrap" style="display:none;">
        <label>Available Times</label>
        <div class="slot-grid" id="slotGrid"></div>
      </div>

      <div class="form-group">
        <label for="reasonInput">Reason for visit (optional)</label>
        <textarea id="reasonInput" placeholder="e.g. Annual check-up, follow-up, new symptoms…"></textarea>
      </div>

      <div id="formAlert" class="alert"></div>

      <button class="btn btn-amber btn-block" id="confirmBtn" disabled>Confirm Appointment</button>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const preselectDoctor = params.get('doctor') || '';
  let departments = [], doctors = [], selectedSlot = null;

  const deptSelect = document.getElementById('deptSelect');
  const doctorSelect = document.getElementById('doctorSelect');
  const dateInput = document.getElementById('dateInput');
  const slotsWrap = document.getElementById('slotsWrap');
  const slotGrid = document.getElementById('slotGrid');
  const confirmBtn = document.getElementById('confirmBtn');
  const formAlert = document.getElementById('formAlert');
  const loginNotice = document.getElementById('loginNotice');

  const today = new Date().toISOString().slice(0, 10);
  dateInput.min = today;
  dateInput.value = today;

  function checkLogin() {
    const user = API.user();
    if (!user || user.role !== 'patient') {
      showAlert(loginNotice, 'You will need to log in or create a free account to confirm your booking — you can browse times first.', 'error');
      return false;
    }
    hideAlert(loginNotice);
    return true;
  }

  async function loadDoctorsForDept(deptId, keepSelection) {
    const doctorsInDept = deptId ? doctors.filter(d => d.departmentId === deptId) : doctors;
    const prevValue = keepSelection ? doctorSelect.value : '';
    doctorSelect.innerHTML = '<option value="">Choose a doctor…</option>' +
      doctorsInDept.map(d => `<option value="${d.id}">${d.name} — ${d.specialty}</option>`).join('');
    if (prevValue && doctorsInDept.find(d => d.id === prevValue)) doctorSelect.value = prevValue;
  }

  async function loadSlots() {
    selectedSlot = null;
    updateConfirmState();
    const doctorId = doctorSelect.value;
    const date = dateInput.value;
    if (!doctorId || !date) { slotsWrap.style.display = 'none'; return; }
    slotsWrap.style.display = 'block';
    slotGrid.innerHTML = '<div style="grid-column:1/-1; color:var(--ink-soft);">Loading times…</div>';
    try {
      const { available } = await API.get(`/api/doctors/${doctorId}/slots?date=${date}`);
      if (available.length === 0) {
        slotGrid.innerHTML = '<div style="grid-column:1/-1; color:var(--ink-soft);">No times available this day — try another date.</div>';
        return;
      }
      slotGrid.innerHTML = available.map(t => `<button type="button" class="slot-btn" data-time="${t}">${fmtTime(t)}</button>`).join('');
      slotGrid.querySelectorAll('.slot-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          slotGrid.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedSlot = btn.dataset.time;
          updateConfirmState();
        });
      });
    } catch (e) {
      slotGrid.innerHTML = '<div style="grid-column:1/-1; color:var(--danger);">Could not load times. Please try again.</div>';
    }
  }

  function updateConfirmState() {
    confirmBtn.disabled = !(doctorSelect.value && dateInput.value && selectedSlot);
  }

  deptSelect.addEventListener('change', () => { loadDoctorsForDept(deptSelect.value, false); slotsWrap.style.display = 'none'; updateConfirmState(); });
  doctorSelect.addEventListener('change', loadSlots);
  dateInput.addEventListener('change', loadSlots);

  confirmBtn.addEventListener('click', async () => {
    hideAlert(formAlert);
    if (!checkLogin()) {
      window.location.href = `login.html?next=book.html&doctor=${doctorSelect.value}`;
      return;
    }
    confirmBtn.disabled = true;
    confirmBtn.innerHTML = '<span class="spinner"></span> Booking…';
    try {
      await API.post('/api/appointments', {
        doctorId: doctorSelect.value,
        date: dateInput.value,
        time: selectedSlot,
        reason: document.getElementById('reasonInput').value
      });
      showAlert(formAlert, 'Appointment confirmed! Redirecting to your dashboard…', 'success');
      setTimeout(() => window.location.href = 'patient-dashboard.html', 1200);
    } catch (e) {
      showAlert(formAlert, e.message, 'error');
      confirmBtn.disabled = false;
      confirmBtn.textContent = 'Confirm Appointment';
      loadSlots();
    }
  });

  (async function () {
    checkLogin();
    departments = await API.get('/api/departments');
    deptSelect.innerHTML = '<option value="">Choose a department…</option>' +
      departments.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    doctors = await API.get('/api/doctors');

    if (preselectDoctor) {
      const doc = doctors.find(d => d.id === preselectDoctor);
      if (doc) {
        deptSelect.value = doc.departmentId;
        await loadDoctorsForDept(doc.departmentId, false);
        doctorSelect.value = doc.id;
        loadSlots();
        return;
      }
    }
    await loadDoctorsForDept('', false);
  })();
</script>
</body>
</html>
