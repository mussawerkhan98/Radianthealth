<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Change Password — Radiant Health Alliance</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body data-page="change-password" class="sx-body">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
</svg>

<header class="site-header" id="site-header"></header>

<main class="sx">
  <div class="container sx-auth single">
    <div class="sx-card sx-auth-card">
      <span class="sx-card-icon amber"><svg width="22" height="22"><use href="#i-lock"/></svg></span>
      <h1>Set a new password</h1>
      <p class="sx-card-sub">This account was created with a temporary password. Please set your own before continuing.</p>

      <div id="formAlert" class="alert"></div>

      <form id="pwForm">
        <div class="form-group">
          <label for="current">Temporary password</label>
          <input type="password" id="current" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="newPw">New password (min 8 characters)</label>
          <input type="password" id="newPw" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="sx-btn sx-btn-blue sx-btn-block" id="submitBtn">Update Password</button>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="/js/app.js"></script>
<script>
  if (!API.user()) window.location.href = '/login';

  const form = document.getElementById('pwForm');
  const formAlert = document.getElementById('formAlert');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(formAlert);
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Updating…';
    try {
      await API.post('/api/change-password', {
        currentPassword: document.getElementById('current').value,
        newPassword: document.getElementById('newPw').value
      });
      const user = API.user();
      showAlert(formAlert, 'Password updated. Redirecting…', 'success');
      setTimeout(() => {
        if (user.role === 'patient') window.location.href = '/patient-dashboard';
        else if (user.role === 'doctor') window.location.href = '/doctor-dashboard';
        else window.location.href = '/admin';
      }, 1000);
    } catch (err) {
      showAlert(formAlert, err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
