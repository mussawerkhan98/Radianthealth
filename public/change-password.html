<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password — Radiant Health Alliance</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="change-password">

<header class="site-header" id="site-header"></header>

<section class="section">
  <div class="container">
    <div class="card form-card" style="padding:2.4rem;">
      <h2 style="text-align:center;">Set a New Password</h2>
      <p style="text-align:center; margin-bottom:1.6rem;">This account was created with a temporary password. Please set your own before continuing.</p>

      <div id="formAlert" class="alert"></div>

      <form id="pwForm">
        <div class="form-group">
          <label for="current">Temporary Password</label>
          <input type="password" id="current" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="newPw">New Password (min 8 characters)</label>
          <input type="password" id="newPw" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Update Password</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script>
  if (!API.user()) window.location.href = 'login.html';

  const form = document.getElementById('pwForm');
  const formAlert = document.getElementById('formAlert');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(formAlert);
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Updating…';
    try {
      await API.post('/api/change-password', {
        currentPassword: document.getElementById('current').value,
        newPassword: document.getElementById('newPw').value
      });
      const user = API.user();
      showAlert(formAlert, 'Password updated. Redirecting…', 'success');
      setTimeout(() => {
        if (user.role === 'patient') window.location.href = 'patient-dashboard.html';
        else if (user.role === 'doctor') window.location.href = 'doctor-dashboard.html';
        else window.location.href = 'admin.html';
      }, 1000);
    } catch (err) {
      showAlert(formAlert, err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
