<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Radiant Health Alliance</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<header class="site-header" id="site-header"></header>

<section class="hero" style="padding-bottom:2vh;">
  <div class="container">
    <span class="eyebrow">Contact Us</span>
    <h1>We'd love to <em>hear</em> from you</h1>
    <p class="lead">Call, message us on WhatsApp, or send a note below — our front desk team will get back to you.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="grid grid-3" style="margin-bottom:2.5rem;">
      <a href="tel:+971543397906" id="callCard" class="card" style="text-align:center; text-decoration:none; color:inherit;">
        <h3 style="font-size:1.05rem; margin-bottom:0.3rem;">Call Us</h3>
        <p id="phoneText" style="margin:0;">+971 54 339 7906</p>
      </a>
      <a href="https://wa.me/971543397906" id="whatsappCard" target="_blank" rel="noopener" class="card" style="text-align:center; text-decoration:none; color:inherit;">
        <h3 style="font-size:1.05rem; margin-bottom:0.3rem;">WhatsApp</h3>
        <p style="margin:0;">Chat with our team</p>
      </a>
      <a href="mailto:hello@radianthealthalliance.com" id="emailCard" class="card" style="text-align:center; text-decoration:none; color:inherit;">
        <h3 style="font-size:1.05rem; margin-bottom:0.3rem;">Email</h3>
        <p id="emailText" style="margin:0;">hello@radianthealthalliance.com</p>
      </a>
    </div>

    <div class="card form-card" style="padding:2rem;">
      <h3 style="text-align:center;">Send Us a Message</h3>
      <div id="formAlert" class="alert"></div>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Message</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script>
  (async function () {
    try {
      const s = await API.get('/api/settings');
      if (s.phone) {
        document.getElementById('callCard').href = 'tel:' + s.phone;
        document.getElementById('phoneText').textContent = s.phone;
      }
      if (s.whatsapp) document.getElementById('whatsappCard').href = 'https://wa.me/' + s.whatsapp;
      if (s.contactEmail) {
        document.getElementById('emailCard').href = 'mailto:' + s.contactEmail;
        document.getElementById('emailText').textContent = s.contactEmail;
      }
    } catch (e) { /* keep defaults already in the HTML */ }
  })();

  const form = document.getElementById('contactForm');
  const formAlert = document.getElementById('formAlert');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(formAlert);
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Sending…';
    try {
      await API.post('/api/contact', {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      });
      showAlert(formAlert, 'Message sent — we will get back to you soon.', 'success');
      form.reset();
    } catch (err) {
      showAlert(formAlert, err.message, 'error');
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Message';
  });
</script>
</body>
</html>
