<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department — Radiant Health Alliance</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="departments">

<header class="site-header" id="site-header"></header>

<div id="deptPage"><section class="section"><div class="container"><div class="empty-state">Loading department…</div></div></section></div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script>
  const id = new URLSearchParams(location.search).get('id') || '';
  const root = document.getElementById('deptPage');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const paras = t => String(t || '').trim() ? String(t).trim().split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g, '<br>')}</p>`).join('') : '';
  const tick = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';

  async function load() {
    let d;
    try { d = await API.get('/api/departments/' + encodeURIComponent(id)); }
    catch (e) {
      root.innerHTML = '<section class="section"><div class="container"><div class="empty-state">This department isn’t available. <a href="departments.html">See all departments</a>.</div></div></section>';
      return;
    }
    document.title = `${d.name} — Radiant Health Alliance`;
    const bookHref = `book.html?department=${encodeURIComponent(d.id)}`;
    const nav = [
      d.about || d.description ? ['about', 'About'] : null,
      d.services.length ? ['services', 'Services'] : null,
      d.conditions.length ? ['conditions', 'Conditions'] : null,
      d.doctors.length ? ['doctors', 'Doctors'] : null,
      d.faqs.length ? ['faqs', 'FAQs'] : null
    ].filter(Boolean);

    root.innerHTML = `
      <section class="hero dept-hero${d.bannerUrl ? ' has-banner' : ''}"${d.bannerUrl ? ` style="--dept-banner:url('${esc(d.bannerUrl)}')"` : ''}>
        <div class="container">
          <a href="departments.html" class="dept-back">&larr; All departments</a>
          <span class="eyebrow">Department</span>
          <h1>${esc(d.name)}</h1>
          ${d.tagline || d.description ? `<p class="lead">${esc(d.tagline || d.description)}</p>` : ''}
          <div class="dept-hero-actions">
            <a class="btn btn-amber" href="${bookHref}">Book an appointment</a>
            ${d.doctors.length ? `<a class="btn btn-outline dept-hero-outline" href="#doctors">Meet our doctors</a>` : ''}
          </div>
        </div>
      </section>
      ${nav.length > 1 ? `<nav class="dept-nav" aria-label="On this page"><div class="container">${nav.map(([k, t]) => `<a href="#${k}">${t}</a>`).join('')}</div></nav>` : ''}
      <section class="section">
        <div class="container dept-layout">
          <div class="dept-main">
            ${d.about || d.description ? `<div class="dept-block" id="about"><h2>About ${esc(d.name)}</h2>${paras(d.about) || `<p>${esc(d.description)}</p>`}</div>` : ''}
            ${d.services.length ? `<div class="dept-block" id="services"><h2>Services &amp; treatments</h2>
              <ul class="dept-services">${d.services.map(x => `<li><span class="dept-tick">${tick}</span>${esc(x)}</li>`).join('')}</ul></div>` : ''}
            ${d.conditions.length ? `<div class="dept-block" id="conditions"><h2>Conditions we treat</h2>
              <div class="profile-chips">${d.conditions.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div></div>` : ''}
            <div class="dept-block" id="doctors"><h2>Our ${esc(d.name)} doctors</h2>
              ${d.doctors.length ? `<div class="grid grid-3">${d.doctors.map(doc => `
                <div class="card doctor-card">
                  ${avatarHtml(doc)}
                  <h3 style="font-size:1.02rem; margin-bottom:0.2rem;">${esc(doc.name)}</h3>
                  <div class="doctor-specialty">${esc(doc.specialty)}</div>
                  ${doctorLocationHtml(doc)}
                  ${doc.offersVideo ? '<span class="badge video" style="margin-top:0.5rem; display:inline-block;">Video visits</span>' : ''}
                  <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; margin-top:0.9rem;">
                    <a href="profile.html?doctor=${encodeURIComponent(doc.id)}" class="btn btn-outline" style="padding:0.5rem 1rem; font-size:0.83rem;">View Profile</a>
                    <a href="book.html?doctor=${encodeURIComponent(doc.id)}" class="btn btn-primary" style="padding:0.5rem 1rem; font-size:0.83rem;">Book</a>
                  </div>
                </div>`).join('')}</div>` : '<p style="color:var(--ink-soft);">Doctors for this department will be listed here soon. You can still book and we’ll match you with the right specialist.</p>'}
            </div>
            ${d.faqs.length ? `<div class="dept-block" id="faqs"><h2>Frequently asked questions</h2>
              <div class="dept-faqs">${d.faqs.map(f => `<details><summary>${esc(f.q)}</summary><div>${paras(f.a)}</div></details>`).join('')}</div></div>` : ''}
          </div>
          <aside class="dept-side">
            <div class="card profile-side">
              <h2>Book a visit</h2>
              <p>Choose a doctor and time online — no account needed.</p>
              <a class="btn btn-amber" href="${bookHref}" style="width:100%; text-align:center;">Book an appointment</a>
            </div>
            ${d.hours.length ? `<div class="card profile-side"><h2>Opening hours</h2><ul class="dept-hours">${d.hours.map(h => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
            <div class="card profile-side" id="deptContact" style="display:none;"></div>
          </aside>
        </div>
      </section>`;
    try {
      const s = await API.get('/api/settings');
      const box = document.getElementById('deptContact');
      const bits = [];
      if (s.phone) bits.push(`<a href="tel:${esc(s.phone.replace(/\s/g, ''))}">${esc(s.phone)}</a>`);
      if (s.whatsapp) bits.push(`<a href="https://wa.me/${esc(String(s.whatsapp).replace(/\D/g, ''))}" target="_blank" rel="noopener">WhatsApp us</a>`);
      if (s.location && s.location.link) bits.push(`<a href="${esc(s.location.link)}" target="_blank" rel="noopener">Get directions</a>`);
      if (bits.length) { box.innerHTML = `<h2>Questions?</h2><p class="dept-contact">${bits.join('<br>')}</p>`; box.style.display = ''; }
    } catch (e) { /* optional */ }
  }
  load();
</script>
</body>
</html>
