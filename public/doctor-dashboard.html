<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Portal — Radiant Health Alliance</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="doctor-dashboard">

<header class="site-header" id="site-header"></header>

<section class="section">
  <div class="container">
    <div class="dash-layout">
      <aside class="dash-sidebar">
        <p style="font-weight:800; margin-bottom:0.2rem;" id="welcomeName">Welcome</p>
        <p style="font-size:0.82rem; margin-bottom:1.2rem;">Doctor Portal</p>
        <a href="#" class="active" data-tab="schedule">My Schedule</a>
        <a href="#" data-tab="patients">My Patients</a>
        <a href="#" id="logoutLink" style="color:var(--danger); margin-top:0.6rem;">Log Out</a>
      </aside>

      <div>
        <div id="tab-schedule">
          <h2>Upcoming Appointments</h2>
          <div id="scheduleList"><div class="empty-state">Loading…</div></div>
        </div>

        <div id="tab-patients" style="display:none;">
          <h2>My Patients</h2>
          <div class="form-group" style="max-width:460px; margin-bottom:0.4rem;">
            <label for="patientSearch" id="patientSearchLabel">Search your patients</label>
            <input type="search" id="patientSearch" placeholder="Name, mobile / Patient ID or email" autocomplete="off">
          </div>
          <p id="patientSearchHint" style="font-size:0.82rem; color:var(--ink-soft); margin:0 0 0.9rem;"></p>
          <div id="patientsList"><div class="empty-state">Loading…</div></div>

          <div id="patientDetail" style="display:none; margin-top:2rem;">
            <div class="card" style="padding:1.6rem;">
              <button class="btn btn-outline" id="backToPatients" style="margin-bottom:1.4rem; padding:0.4rem 0.9rem; font-size:0.8rem;">&larr; Back to patients</button>
              <h3 id="patientDetailName"></h3>
              <p id="patientDetailMeta" style="margin-bottom:1.4rem;"></p>

              <h4>Add a Note</h4>
              <div id="recordAlert" class="alert"></div>
              <form id="recordForm">
                <div class="form-group">
                  <label for="diagnosis">Diagnosis (optional)</label>
                  <input type="text" id="diagnosis">
                </div>
                <div class="form-group">
                  <label for="notes">Notes</label>
                  <textarea id="notes" required></textarea>
                </div>
                <div class="form-group">
                  <label for="prescription">Prescription (optional)</label>
                  <input type="text" id="prescription">
                </div>
                <div class="form-group">
                  <label for="recordFiles">Attach files (optional)</label>
                  <input type="file" id="recordFiles" multiple accept=".pdf,.jpg,.jpeg,.png,.webp,.gif,.doc,.docx,.xlsx,application/pdf,image/*">
                  <p style="font-size:0.8rem; color:var(--ink-soft); margin-top:0.35rem;">Lab reports, scans, prescriptions — PDF, images, Word or Excel, up to 3 MB each. Only doctors and admin can open them.</p>
                </div>
                <button type="submit" class="btn btn-primary" id="saveNoteBtn">Save Note</button>
              </form>

              <h4 style="margin-top:2rem;">History</h4>
              <div id="patientHistoryList"><div class="empty-state">Loading…</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script>
  const user = requireRole('doctor');
  let currentPatientId = null;

  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    API.clearSession();
    window.location.href = 'index.html';
  });

  const tabs = document.querySelectorAll('[data-tab]');
  tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-schedule').style.display = tab.dataset.tab === 'schedule' ? 'block' : 'none';
      document.getElementById('tab-patients').style.display = tab.dataset.tab === 'patients' ? 'block' : 'none';
    });
  });

  async function loadSchedule() {
    try {
      const appts = await API.get('/api/doctors/me/appointments');
      const now = new Date();
      const upcoming = appts.filter(a => new Date(a.date + 'T' + a.time).getTime() + 60 * 60000 >= now.getTime());
      const el = document.getElementById('scheduleList');
      el.innerHTML = upcoming.length
        ? upcoming.map(a => `
            <div class="list-item">
              <div>
                <strong>${a.patientName}</strong>${a.visitType === 'video' ? ' <span class="badge video">Video call</span>' : ''}<br>
                <span style="color:var(--ink-soft); font-size:0.9rem;">${fmtDate(a.date)} at ${fmtTime(a.time)}</span>
                ${a.reason ? `<br><span style="color:var(--ink-soft); font-size:0.85rem;">Reason: ${a.reason}</span>` : ''}
              </div>
              <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
                ${a.videoLink && true ? `<a class="btn btn-amber" style="padding:0.4rem 0.9rem; font-size:0.8rem;" href="${a.videoLink}" target="_blank" rel="noopener">Join video call</a>` : ''}
                <span class="badge confirmed">confirmed</span>
              </div>
            </div>
          `).join('')
        : '<div class="empty-state">No upcoming appointments.</div>';
    } catch (e) {
      document.getElementById('scheduleList').innerHTML = '<div class="empty-state">Could not load schedule.</div>';
    }
  }

  // Search: filters my patients here; if the clinic lets doctors search all
  // patients, the server searches everyone instead.
  let myPatients = [], searchAll = false, searchTimer = null;
  async function loadPatients() {
    try {
      const res = await fetch('/api/doctors/me/patients', { headers: { Authorization: 'Bearer ' + API.token() } });
      if (!res.ok) throw new Error();
      searchAll = res.headers.get('X-Search-All') === '1';
      myPatients = await res.json();
      document.getElementById('patientSearchLabel').textContent = searchAll ? 'Search all clinic patients' : 'Search your patients';
      document.getElementById('patientSearchHint').textContent = searchAll
        ? 'Your own patients are listed below. Type to search every patient in the clinic.'
        : 'Patients who have booked with you.';
      renderPatients(filterMine(document.getElementById('patientSearch').value));
    } catch (e) {
      document.getElementById('patientsList').innerHTML = '<div class="empty-state">Could not load patients.</div>';
    }
  }
  function filterMine(q) {
    q = String(q || '').trim().toLowerCase();
    if (!q) return myPatients;
    const digits = q.replace(/\D/g, '').replace(/^0+/, '');
    return myPatients.filter(p => [p.name, p.email].some(v => String(v || '').toLowerCase().includes(q)) ||
      (digits.length >= 3 && String(p.patientId || '').replace(/\D/g, '').includes(digits)));
  }
  document.getElementById('patientSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = document.getElementById('patientSearch').value.trim();
    if (!searchAll || q.length < 2) { renderPatients(filterMine(q), q); return; }
    searchTimer = setTimeout(async () => {
      try { renderPatients(await API.get('/api/doctors/me/patients?q=' + encodeURIComponent(q)), q); }
      catch (err) { document.getElementById('patientsList').innerHTML = `<div class="empty-state">${escHtml(err.message)}</div>`; }
    }, 300);
  });
  function renderPatients(patients, q) {
      const el = document.getElementById('patientsList');
      el.innerHTML = patients.length
        ? patients.map(p => `
            <div class="list-item" style="cursor:pointer;" data-patient="${p.id}" data-name="${escHtml(p.name)}" data-meta="${escHtml([p.patientId ? 'Patient ID ' + p.patientId : '', p.email].filter(Boolean).join(' · '))}">
              <div><strong>${escHtml(p.name)}</strong>${p.patientId ? ` <span class="badge">ID ${escHtml(p.patientId)}</span>` : ''}${p.mine === false ? ' <span class="badge" title="Has not booked with you">other doctor</span>' : ''}<br><span style="color:var(--ink-soft); font-size:0.85rem;">${escHtml([p.phone, p.email].filter(Boolean).join(' · '))}</span></div>
              <span class="btn btn-outline" style="padding:0.4rem 0.9rem; font-size:0.8rem;">View History</span>
            </div>
          `).join('')
        : (q ? '<div class="empty-state">No patients match your search.</div>' : '<div class="empty-state">No patients yet — once someone books with you, they will appear here.</div>');

      el.querySelectorAll('[data-patient]').forEach(row => {
        row.addEventListener('click', () => openPatient(row.dataset.patient, row.dataset.name, row.dataset.meta));
      });
  }

  async function openPatient(id, name, meta) {
    currentPatientId = id;
    document.getElementById('patientDetail').style.display = 'block';
    document.getElementById('patientDetailName').textContent = name;
    document.getElementById('patientDetailMeta').textContent = meta;
    await loadPatientHistory();
  }

  document.getElementById('backToPatients').addEventListener('click', () => {
    document.getElementById('patientDetail').style.display = 'none';
    currentPatientId = null;
  });

  const escHtml = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtSize = n => n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + ' KB' : (n / 1024 / 1024).toFixed(1) + ' MB';

  function filesHtml(r) {
    if (!r.files || !r.files.length) return '';
    return `<div style="margin-top:0.5rem;">` + r.files.map(f => `
      <div style="display:flex; align-items:center; gap:0.6rem; margin:0.25rem 0; font-size:0.88rem;">
        <span style="color:var(--ink-soft); display:inline-flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></span>
        <a href="#" data-view-file="${f.id}" data-filename="${escHtml(f.filename)}" data-mime="${escHtml(f.mimeType)}" title="View">${escHtml(f.filename)}</a>
        <span style="color:var(--ink-soft);">${fmtSize(f.size)}</span>
        <a href="#" data-download-file="${f.id}" data-filename="${escHtml(f.filename)}" style="font-size:0.8rem;">Download</a>
        ${user && f.uploadedById === user.id ? `<a href="#" data-remove-file="${f.id}" style="color:var(--danger); font-size:0.8rem;">Remove</a>` : ''}
      </div>`).join('') + `</div>`;
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(new Error(`Could not read "${file.name}".`));
      r.readAsDataURL(file);
    });
  }

  async function loadPatientHistory() {
    const el = document.getElementById('patientHistoryList');
    el.innerHTML = '<div class="empty-state">Loading…</div>';
    try {
      const records = await API.get(`/api/doctors/me/patients/${currentPatientId}/records`);
      el.innerHTML = records.length
        ? records.map(r => `
            <div class="timeline-item">
              <div class="timeline-date">${fmtDate(r.date)}</div>
              ${r.diagnosis ? `<p style="margin:0.3rem 0 0.2rem;"><strong>Diagnosis:</strong> ${r.diagnosis}</p>` : ''}
              <p style="margin:0.2rem 0;"><strong>Notes:</strong> ${r.notes}</p>
              ${r.prescription ? `<p style="margin:0.2rem 0;"><strong>Prescription:</strong> ${r.prescription}</p>` : ''}
              ${r.doctorName ? `<p style="margin:0.2rem 0; font-size:0.8rem; color:var(--ink-soft);">By ${escHtml(r.doctorName)}${r.enteredByName ? ' · entered by ' + escHtml(r.enteredByName) : ''}</p>` : ''}
              ${filesHtml(r)}
            </div>
          `).join('')
        : '<div class="empty-state">No history yet for this patient.</div>';
      el.querySelectorAll('[data-view-file]').forEach(a => a.addEventListener('click', (e) => {
        e.preventDefault();
        openFileViewer(a.dataset.viewFile, a.dataset.filename, a.dataset.mime);
      }));
      el.querySelectorAll('[data-download-file]').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        try { await downloadPrivateFile(a.dataset.downloadFile, a.dataset.filename); } catch (err) { alert(err.message); }
      }));
      el.querySelectorAll('[data-remove-file]').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Remove this file from the record? This cannot be undone.')) return;
        try { await API.del(`/api/doctors/me/files/${a.dataset.removeFile}`); loadPatientHistory(); } catch (err) { alert(err.message); }
      }));
    } catch (e) {
      el.innerHTML = '<div class="empty-state">Could not load history.</div>';
    }
  }

  const recordForm = document.getElementById('recordForm');
  const recordAlert = document.getElementById('recordAlert');
  recordForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(recordAlert);
    const saveBtn = document.getElementById('saveNoteBtn');
    const files = [...document.getElementById('recordFiles').files];
    const tooBig = files.find(f => f.size > 3 * 1024 * 1024);
    if (tooBig) return showAlert(recordAlert, `"${tooBig.name}" is larger than 3 MB. Please compress it or split it.`, 'error');
    if (files.length > 20) return showAlert(recordAlert, 'Please attach at most 20 files per note.', 'error');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner"></span> Saving…';
    const failed = [];
    try {
      const record = await API.post(`/api/doctors/me/patients/${currentPatientId}/records`, {
        diagnosis: document.getElementById('diagnosis').value,
        notes: document.getElementById('notes').value,
        prescription: document.getElementById('prescription').value
      });
      for (let i = 0; i < files.length; i++) {
        saveBtn.innerHTML = `<span class="spinner"></span> Uploading ${i + 1} of ${files.length}…`;
        try {
          await API.post(`/api/doctors/me/records/${record.id}/files`, { filename: files[i].name, data: await readAsDataUrl(files[i]) });
        } catch (err) {
          failed.push(err.message);
        }
      }
      recordForm.reset();
      if (failed.length) showAlert(recordAlert, 'Note saved, but some files were not uploaded: ' + failed.join(' '), 'error');
      else showAlert(recordAlert, files.length ? `Note saved with ${files.length} file${files.length === 1 ? '' : 's'}.` : 'Note saved.', 'success');
      loadPatientHistory();
    } catch (err) {
      showAlert(recordAlert, err.message, 'error');
    }
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Note';
  });

  document.getElementById('welcomeName').textContent = 'Welcome, ' + (user ? user.name : '');
  loadSchedule();
  loadPatients();
</script>
</body>
</html>
