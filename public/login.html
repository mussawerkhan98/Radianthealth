<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Radiant Health Alliance</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

<header class="site-header" id="site-header"></header>

<section class="section">
  <div class="container">
    <div class="card form-card" style="padding:2.4rem;">
      <h2 style="text-align:center;">Log In</h2>
      <p style="text-align:center; margin-bottom:1.6rem;">Patients, doctors and staff all log in here.</p>

      <div id="formAlert" class="alert"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Log In</button>
      </form>

      <p style="text-align:center; margin-top:1.4rem; font-size:0.9rem;">
        New patient? <a href="register.html">Create an account</a>
      </p>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const form = document.getElementById('loginForm');
  const formAlert = document.getElementById('formAlert');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert(formAlert);
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Logging in…';
    try {
      const { token, user } = await API.post('/api/login', {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });
      API.setSession(token, user);

      if (user.mustChangePassword) {
        window.location.href = 'change-password.html';
        return;
      }

      const next = params.get('next');
      if (next === 'book.html') {
        const doctor = params.get('doctor');
        window.location.href = doctor ? `book.html?doctor=${doctor}` : 'book.html';
      } else if (user.role === 'patient') {
        window.location.href = 'patient-dashboard.html';
      } else if (user.role === 'doctor') {
        window.location.href = 'doctor-dashboard.html';
      } else {
        window.location.href = 'admin.html';
      }
    } catch (err) {
      showAlert(formAlert, err.message, 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
