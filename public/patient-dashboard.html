<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Radiant Health Alliance</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="patient-dashboard">

<header class="site-header" id="site-header"></header>

<section class="section">
  <div class="container">
    <div class="dash-layout">
      <aside class="dash-sidebar">
        <p style="font-weight:800; margin-bottom:0.2rem;" id="welcomeName">Welcome</p>
        <p style="font-size:0.82rem; margin-bottom:0.3rem;">Patient Portal</p>
        <p style="font-size:0.82rem; margin-bottom:1.2rem;" id="patientIdLine"></p>
        <a href="#" class="active" data-tab="upcoming">Upcoming Appointments</a>
        <a href="#" data-tab="past">Past Appointments</a>
        <a href="#" data-tab="history">Medical History</a>
        <a href="book.html">Book New Appointment</a>
        <a href="#" id="logoutLink" style="color:var(--danger); margin-top:0.6rem;">Log Out</a>
      </aside>

      <div>
        <div id="tab-upcoming">
          <h2>Upcoming Appointments</h2>
          <div id="upcomingList"><div class="empty-state">Loading…</div></div>
        </div>

        <div id="tab-past" style="display:none;">
          <h2>Past Appointments</h2>
          <div id="pastList"><div class="empty-state">Loading…</div></div>
        </div>

        <div id="tab-history" style="display:none;">
          <h2>My Medical History</h2>
          <p>These notes are added by your doctor after each visit.</p>
          <div id="historyList"><div class="empty-state">Loading…</div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/app.js"></script>
<script>
  const user = requireRole('patient');

  document.getElementById('logoutLink').addEventListener('click', (e) => {
    e.preventDefault();
    API.clearSession();
    window.location.href = 'index.html';
  });

  const tabs = document.querySelectorAll('[data-tab]');
  tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      ['upcoming', 'past', 'history'].forEach(name => {
        document.getElementById('tab-' + name).style.display = (name === tab.dataset.tab) ? 'block' : 'none';
      });
    });
  });

  function apptRow(a) {
    return `
      <div class="list-item">
        <div>
          <strong>${a.doctorName}</strong> — ${a.departmentName}${a.visitType === 'video' ? ' <span class="badge video">Video call</span>' : ''}<br>
          <span style="color:var(--ink-soft); font-size:0.9rem;">${fmtDate(a.date)} at ${fmtTime(a.time)}</span>
          ${a.reason ? `<br><span style="color:var(--ink-soft); font-size:0.85rem;">Reason: ${a.reason}</span>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:0.7rem;">
          ${a.videoLink && a.status === 'confirmed' ? `<a class="btn btn-amber" style="padding:0.4rem 0.9rem; font-size:0.8rem;" href="${a.videoLink}" target="_blank" rel="noopener">Join video call</a>` : ''}
          <span class="badge ${a.status}">${a.status}</span>
          ${a.status === 'confirmed' ? `<button class="btn btn-danger" style="padding:0.4rem 0.9rem; font-size:0.8rem;" data-cancel="${a.id}">Cancel</button>` : ''}
        </div>
      </div>
    `;
  }

  async function loadAppointments() {
    try {
      const all = await API.get('/api/patients/me/appointments');
      const now = new Date();
      const isUpcoming = a => a.status === 'confirmed' && new Date(a.date + 'T' + a.time).getTime() + 60 * 60000 >= now.getTime();
      const upcoming = all.filter(isUpcoming);
      const past = all.filter(a => !isUpcoming(a));

      document.getElementById('upcomingList').innerHTML = upcoming.length
        ? upcoming.map(apptRow).join('')
        : '<div class="empty-state">No upcoming appointments. <a href="book.html">Book one now</a>.</div>';

      document.getElementById('pastList').innerHTML = past.length
        ? past.map(apptRow).join('')
        : '<div class="empty-state">No past appointments yet.</div>';

      document.querySelectorAll('[data-cancel]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Cancel this appointment?')) return;
          btn.disabled = true;
          try {
            await API.post(`/api/patients/me/appointments/${btn.dataset.cancel}/cancel`, {});
            loadAppointments();
          } catch (e) {
            alert(e.message);
            btn.disabled = false;
          }
        });
      });
    } catch (e) {
      document.getElementById('upcomingList').innerHTML = '<div class="empty-state">Could not load appointments.</div>';
    }
  }

  async function loadHistory() {
    try {
      const records = await API.get('/api/patients/me/records');
      const el = document.getElementById('historyList');
      el.innerHTML = records.length
        ? records.map(r => `
            <div class="timeline-item">
              <div class="timeline-date">${fmtDate(r.date)} — ${r.doctorName}</div>
              ${r.diagnosis ? `<p style="margin:0.3rem 0 0.2rem;"><strong>Diagnosis:</strong> ${r.diagnosis}</p>` : ''}
              <p style="margin:0.2rem 0;"><strong>Notes:</strong> ${r.notes}</p>
              ${r.prescription ? `<p style="margin:0.2rem 0;"><strong>Prescription:</strong> ${r.prescription}</p>` : ''}
            </div>
          `).join('')
        : '<div class="empty-state">No medical history recorded yet.</div>';
    } catch (e) {
      document.getElementById('historyList').innerHTML = '<div class="empty-state">Could not load medical history.</div>';
    }
  }

  document.getElementById('welcomeName').textContent = 'Welcome, ' + (user ? user.name.split(' ')[0] : '');
  API.get('/api/patients/me').then(me => {
    const el = document.getElementById('patientIdLine');
    el.innerHTML = me.patientId ? `Patient ID: <strong>${me.patientId}</strong>` : '';
  }).catch(() => {});
  loadAppointments();
  loadHistory();
</script>
</body>
</html>
